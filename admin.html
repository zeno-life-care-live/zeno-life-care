<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZenoLife Care • Admin Login</title><link rel="stylesheet" href="style.css"></head>
<body class="blossom-bg"><div class="petals" aria-hidden="true"></div>
<main class="auth-shell">
<section class="brand-card glass"><div class="logo">Z<span>✿</span></div><h1>ZenoLife Care</h1><p>Secure Admin Console</p></section>
<section class="login-card glass"><div class="eyebrow">ADMIN LOGIN</div><div class="admin-warning">⚠ This is the Admin page. Customer accounts cannot log in here.</div><h2>Control Center</h2><p class="muted">Admin ID aur password se secure panel open karein.</p>
<form id="adminLoginForm"><label>Admin Email<input id="adminEmail" type="email" required autocomplete="username"></label><label>Password<input id="adminPassword" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Enter Admin Panel <span>→</span></button></form><p id="adminLoginMsg" class="message"></p><div class="small-links"><a href="index.html">← Customer Login</a></div></section></main>
<script type="module" src="admin.js"></script></body></html>
