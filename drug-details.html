<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZenoLife Care • Drug Details</title><link rel="stylesheet" href="style.css"></head>
<body class="blossom-bg"><div class="petals" aria-hidden="true"></div><header class="topbar glass"><div class="brand-mini"><span class="logo small">✿</span><div><b>ZenoLife Care</b><small id="medicalName">Drug Details</small></div></div><div class="top-actions"><button id="supportBtn" class="ghost">Customer Support</button><button id="cartBtn" class="primary">Cart <span id="cartCount">0</span></button><button id="backBtn" class="ghost">← Back</button></div></header>
<main class="container"><section id="detailCard" class="detail-card glass"><div class="detail-loading">Loading drug details…</div></section></main><div id="toast" class="toast"></div>
<dialog id="supportDialog" class="dialog"><div class="dialog-card support-card"><button type="button" class="close" id="closeSupport">×</button><div class="eyebrow">CUSTOMER SUPPORT</div><h2>Need help?</h2><p class="muted">Order ya kisi bhi problem ke liye humse contact karein.</p><a class="primary support-link" href="tel:9934872568">📞 Call 9934872568</a><a class="ghost support-link" href="mailto:bhaiajju44765@gmail.com">✉ Email bhaiajju44765@gmail.com</a></div></dialog>
<dialog id="cartDialog" class="dialog"><div class="dialog-card wide"><button type="button" class="close" id="closeCart">×</button><div class="eyebrow">YOUR CART</div><h2>Cart</h2><div id="cartList"></div><div class="cart-total"><span>Total</span><b id="cartTotal">₹0.00</b></div><button id="goCart" class="primary full">Open Order Cart →</button></div></dialog>
<script type="module">
import{auth,db}from"./firebase.js";import{onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{doc,getDoc}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const $=s=>document.querySelector(s),money=n=>`₹${Number(n||0).toFixed(2)}`;let m,cart=JSON.parse(localStorage.getItem("zenoCart")||"[]");const id=new URLSearchParams(location.search).get("id");
onAuthStateChanged(auth,async u=>{if(!u)return location.replace("index.html");const cs=await getDoc(doc(db,"customers",u.uid));if(!cs.exists()||cs.data().active===false){await signOut(auth);return location.replace("index.html")}$("#medicalName").textContent=cs.data().medicalName||"Drug Details";renderCart();if(!id)return location.replace("customer.html");const s=await getDoc(doc(db,"medicines",id));if(!s.exists())return $("#detailCard").innerHTML=`<div class="empty">Medicine not found.</div>`;m={id:s.id,...s.data()};render()});
function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(){const ok=m.available&&Number(m.quantity)>0;$("#detailCard").innerHTML=`<div class="detail-grid"><div>${m.imageData?`<img class="detail-image" src="${m.imageData}" alt="${esc(m.name)}">`:`<div class="detail-image placeholder">✿</div>`}</div><div class="detail-copy"><div class="eyebrow">DRUG DETAILS</div><h1>${esc(m.name)}</h1>${m.category?`<span class="pill">${esc(m.category)}</span>`:""}<div class="composition-box"><span>Composition</span><b>${esc(m.composition||"Not specified")}</b></div><div class="detail-row"><span>N. Rate</span><b>${money(m.sellRate)}</b></div><div class="detail-row"><span>Exp.</span><b>N. RATE</b></div><div class="detail-row"><span>MRP</span><b>N. RATE</b></div><div class="availability-box ${ok?"available":"unavailable"}">${ok?`✓ Available • ${Number(m.quantity)} in stock`:`× Currently unavailable`}</div><button class="primary full" id="addDetail" ${!ok?"disabled":""}>Add to Cart</button></div></div>`;$("#addDetail").onclick=()=>{const x=cart.find(a=>a.id===m.id);if(x)x.qty=Math.min(x.qty+1,Number(m.quantity));else cart.push({id:m.id,qty:1});save();toast(`${m.name} cart me add ho gayi ✓`)}}
function save(){localStorage.setItem("zenoCart",JSON.stringify(cart));renderCart()};function renderCart(){$("#cartCount").textContent=cart.reduce((a,b)=>a+b.qty,0);$("#cartList").innerHTML=cart.length?cart.map(x=>`<div class="cart-item"><b>${esc(x.id===m?.id?m.name:"Medicine")}</b><span>Qty ${x.qty}</span></div>`).join(""):"<div class='empty'>Cart is empty.</div>";$ ("#cartTotal").textContent="Open cart for final total"}
function toast(x){$("#toast").textContent=x;$("#toast").classList.add("show");setTimeout(()=>$("#toast").classList.remove("show"),2500)}
$("#backBtn").onclick=()=>history.back();$("#supportBtn").onclick=()=>$("#supportDialog").showModal();$("#closeSupport").onclick=()=>$("#supportDialog").close();$("#cartBtn").onclick=()=>$("#cartDialog").showModal();$("#closeCart").onclick=()=>$("#cartDialog").close();$("#goCart").onclick=()=>location.href="customer.html#cart";
</script></body></html>
